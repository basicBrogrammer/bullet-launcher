apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'io.sentry.android.gradle'

def sentryProperties = new Properties()
def sentryPropsFile = rootProject.file("sentry.properties")
if (sentryPropsFile.exists()) {
    sentryPropsFile.withInputStream { sentryProperties.load(it) }
}

def localProperties = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProperties.load(it) }
}

def sentryDsn = System.getenv("SENTRY_DSN")
        ?: localProperties.getProperty("sentry.dsn", "")
        ?: sentryProperties.getProperty("dsn", "")

def sentryOrg = sentryProperties.getProperty("defaults.org", "")
def sentryProject = sentryProperties.getProperty("defaults.project", "")
def sentryAuthToken = System.getenv("SENTRY_AUTH_TOKEN") ?: sentryProperties.getProperty("auth.token", "")

android {
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "app.bulletlauncher"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 110
        versionName "v6.7.19"

        resourceConfigurations += ["en", "ar", "de", "es-rES", "es-rUS", "fr", "he", "hr", "hu", "in", "it", "ja", "nl", "pl", "pt-rBR", "ru-rRU", "sv", "tr", "uk", "zh"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SENTRY_DSN", "\"${sentryDsn.replace("\"", "\\\"")}\""
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    namespace 'app.olauncher'
}

sentry {
    debug = false
    org = sentryOrg
    projectName = sentryProject
    authToken = sentryAuthToken
    includeProguardMapping = true
    autoUploadProguardMapping = !sentryAuthToken.isEmpty()
    tracingInstrumentation {
        enabled = true
        features = [
                io.sentry.android.gradle.extensions.InstrumentationFeature.DATABASE,
                io.sentry.android.gradle.extensions.InstrumentationFeature.FILE_IO,
        ]
    }
    autoInstallation {
        enabled = true
        sentryVersion = '8.53.0'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Horizontal journal pages (Monthly | Daily | Future)
    implementation libs.viewpager2

    // Work Manager
    implementation libs.work.runtime.ktx

    //Material dependency
    implementation libs.material

    // Test-only: JVM screenshot rendering for PR demos (no emulator/device needed).
    // These are testImplementation only and do NOT affect the app APK.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Renders Olauncher screens to PNGs in app/build/demo-screenshots/ using
// Robolectric native graphics (no emulator/device needed). Used to attach
// visual demos of UI changes to PRs. Reuses the fully-configured unit test
// task, scoped to the demo package, and forces a re-render each run.
def renderingDemos = gradle.startParameter.taskNames.any { it.endsWith("renderDemoScreens") }
if (renderingDemos) {
    afterEvaluate {
        tasks.named("testDebugUnitTest").configure {
            filter { includeTestsMatching("app.olauncher.demo.*") }
            outputs.upToDateWhen { false }
        }
    }
}
tasks.register("renderDemoScreens") {
    group = "verification"
    description = "Render Olauncher screens to PNGs (build/demo-screenshots) for PR demos."
    dependsOn("testDebugUnitTest")
    doLast {
        println("Demo screenshots written to: ${layout.buildDirectory.get()}/demo-screenshots")
    }
}